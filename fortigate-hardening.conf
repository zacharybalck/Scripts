# --- FortiGate Hardening CLI Configuration ---

config system global
    set admin-timeout 10
    set admintimeout-override enable
    set gui-theme mariner
end

config system admin setting
    set acl-eval-order src-dst-intf
    set allow-traffic-redirect disable
end

config system settings
    set tcp-rst-timer 5
end

config system ssh-setting
    set encryption-sw-cipher chacha20-poly1305 aes128-ctr aes192-ctr aes256-ctr
    set hostkey-des-cbc disable
    set key-exchange-algo diffie-hellman-group14-sha256 ecdh-sha2-nistp256
end

config system accprofile
    edit "restrictive_admin"
        set secfabgrp read
        set ftviewgrp read
        set authgrp read
        set sysgrp read-write
        set netgrp read-write
        set loggrp read-write
        set routegrp read-write
        set firewallgrp read-write
        set vpngrp read-write
    next
end

config log syslogd setting
    set status enable
    set server "10.100.10.50"
    set mode udp
    set facility local6
    set port 514
end
