! --- Cisco IOS Hardened Baseline Configuration ---

! Global Settings & Hostname
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no ip domain-lookup
ip domain-name enterprise.local

! Secure Authentication & AAA
aaa new-model
aaa authentication login default local
aaa authorization exec default local 
username admin privilege 15 secret 9 $1$encrypted_password_hash_here

! Hardened Line VTY / Console Settings
line con 0
 exec-timeout 15 0
 logging synchronous
 login local
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 logging synchronous
line vty 5 15
 transport input ssh
 exec-timeout 10 0
 logging synchronous

! SSHv2 Enforcement
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! Global Security & Management Services
no ip http server
no ip http secure-server
no cdp run
no lldp run

! Centralized Logging & NTP
logging buffered 65536 informational
logging trap debugging
logging host 10.100.10.50
ntp server 10.100.10.10
